[project]
name = "robin-router"
version = "0.1.0"
description = "Round-robin your LLM subscriptions: one OpenAI-compatible endpoint over every plan you hold, rotating on conversation boundaries so prefix caches survive."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "linxuhao"}]
keywords = ["llm", "router", "proxy", "round-robin", "deepseek", "openai-compatible", "rate-limit", "failover"]
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.package-data]
robin = ["py.typed", "*.example.json"]

[project.urls]
Homepage = "https://github.com/linxuhao/robin-router"

[project.scripts]
robin = "robin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
